name: Trading Signal Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Configurer Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances directement
        run: |
          python -m pip install --upgrade pip
          pip install pandas ta requests yfinance

      - name: Exécuter le Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
