name: ICT Session & News Alerts Bot

on:
  schedule:
    # 08:00 EAT (05:00 UTC) -> Briefing Matin
    - cron: '0 5 * * 1-5'
    # 11:00 EAT (08:00 UTC) -> London Open
    - cron: '0 8 * * 1-5'
    # 16:30 EAT (13:30 UTC) -> NY Open
    - cron: '30 13 * * 1-5'
    # 19:00 EAT (16:00 UTC) -> London Close
    - cron: '0 16 * * 1-5'

  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pytz

      - name: Run Alert Morning (08:00 EAT)
        if: github.event.schedule == '0 5 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py morning

      - name: Run Alert London Open (11:00 EAT)
        if: github.event.schedule == '0 8 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py london_open

      - name: Run Alert NY Open (16:30 EAT)
        if: github.event.schedule == '30 13 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py ny_open

      - name: Run Alert London Close (19:00 EAT)
        if: github.event.schedule == '0 16 * * 1-5'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py london_close
