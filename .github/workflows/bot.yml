name: Bot ICT SMC Trading Alerts

on:
  schedule:
    - cron: '0 8 * * *'    # 08:00 UTC (11:00 Madagascar)
    - cron: '30 13 * * *'  # 13:30 UTC (16:30 Madagascar)
    - cron: '0 16 * * *'   # 16:00 UTC (19:00 Madagascar)
  
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code de la repository
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot yfinance pandas numpy

      - name: Exécuter le script de trading
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
